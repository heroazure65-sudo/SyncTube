name: Build SyncTube WebView Runtime Test

on:
  workflow_dispatch:
  push:
    branches:
      - android/webview-runtime-test
    paths:
      - "android-fresh/**"
      - ".github/workflows/build-webview-runtime-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build minimal local WebView diagnostic APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build diagnostic APK
        working-directory: android-fresh
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-fresh/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p android-fresh/experiment-output
          cp "$APK" android-fresh/experiment-output/SyncTube-WebView-Runtime-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncTube-WebView-Runtime-Test
          path: android-fresh/experiment-output/SyncTube-WebView-Runtime-Test.apk
          if-no-files-found: error
          retention-days: 14
