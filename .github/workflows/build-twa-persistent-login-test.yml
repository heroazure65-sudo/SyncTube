name: Build SyncTube Custom Tabs Session Test

on:
  workflow_dispatch:
  push:
    branches:
      - android/custom-tabs-session-test
    paths:
      - "android-twa/**"
      - ".github/workflows/build-twa-persistent-login-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build native Custom Tabs test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: android-twa
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-twa/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p android-twa/output
          cp "$APK" android-twa/output/SyncTube-Custom-Tabs-Test.apk
          test -s android-twa/output/SyncTube-Custom-Tabs-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncTube-Custom-Tabs-Test
          path: android-twa/output/SyncTube-Custom-Tabs-Test.apk
          if-no-files-found: error
          retention-days: 14
